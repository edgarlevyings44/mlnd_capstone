[project]
name = "mlnd"
version = "0.1.0"
description = "Interpretable MLND detection: scripted pipeline, FastAPI service, MLflow tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "catboost>=1.2.10",
    "dagshub>=0.7.3",
    "fastapi>=0.162.0",
    "imbalanced-learn>=0.14.2",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "uvicorn[standard]>=0.54.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"